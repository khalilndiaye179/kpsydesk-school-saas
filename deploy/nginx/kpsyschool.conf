# ==============================================================================
# CONFIGURATION REVERSE PROXY NGINX FRONTAL — COHABITATION VPS
# ==============================================================================

# 1. APPLICATION 1 : KPSyDesk (Gestion ITAM existante en production)
server {
    listen 80;
    listen [::]:80;
    server_name app.kpsyinformatique.com;

    # Redirection automatique HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.kpsyinformatique.com;

    ssl_certificate /etc/letsencrypt/live/app.kpsyinformatique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.kpsyinformatique.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8080; # Redirection vers le conteneur KPSyDesk Frontend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. APPLICATION 2 : KPsySchool (Nouvelle application Gestion Scolaire)
server {
    listen 80;
    listen [::]:80;
    server_name school.kpsyinformatique.com;

    # Redirection automatique HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.kpsyinformatique.com;

    ssl_certificate /etc/letsencrypt/live/school.kpsyinformatique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.kpsyinformatique.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend React App
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
