
# ==============================================================================
# DOCKER COMPOSE — KPSYSCHOOL (GESTION SCOLAIRE SAAS)
# Stack complètement isolée de KPSyDesk (Bases, secrets et réseaux séparés)
# ==============================================================================

networks:
  kpsyschool_net:
    driver: bridge

volumes:
  kpsyschool_pgdata:
    driver: local
  kpsyschool_backups:
    driver: local

services:
  # 1. BASE DE DONNÉES POSTGRESQL DÉDIÉE
  kpsyschool_postgres:
    image: postgres:15-alpine
    container_name: kpsyschool_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kpsyschool_db}
      POSTGRES_USER: ${POSTGRES_USER:-kpsyschool_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecuredPassword2026!}
    volumes:
      - kpsyschool_pgdata:/var/lib/postgresql/data
    networks:
      - kpsyschool_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kpsyschool_admin} -d ${POSTGRES_DB:-kpsyschool_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. BACKEND NESTJS SCOLAIRE
  kpsyschool_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpsyschool_backend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-kpsyschool_admin}:${POSTGRES_PASSWORD:-SecuredPassword2026!}@kpsyschool_postgres:5432/${POSTGRES_DB:-kpsyschool_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-KPsySchool_JWT_Secret_Key_998877665544332211!}
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-kpsydesk.support@kpsyinformatique.com}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-"KPSyDesk School <kpsydesk.support@kpsyinformatique.com>"}
    ports:
      - "127.0.0.1:8091:3000"
    depends_on:
      kpsyschool_postgres:
        condition: service_healthy
    networks:
      - kpsyschool_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  # 3. FRONTEND REACT/VITE SCOLAIRE (NGINX)
  kpsyschool_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kpsyschool_frontend
    restart: always
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - kpsyschool_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  # 4. CONTENEUR SAUVEGARDE POSTGRESQL AUTONOME (CRON 2h DU MATIN)
  kpsyschool_backup:
    image: postgres:15-alpine
    container_name: kpsyschool_backup
    restart: always
    environment:
      POSTGRES_HOST: kpsyschool_postgres
      POSTGRES_DB: ${POSTGRES_DB:-kpsyschool_db}
      POSTGRES_USER: ${POSTGRES_USER:-kpsyschool_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecuredPassword2026!}
    volumes:
      - kpsyschool_backups:/backups
      - ./deploy/scripts/backup-kpsyschool-postgres.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "echo '0 2 * * * /backup.sh' | crond -f"]
    depends_on:
      - kpsyschool_postgres
    networks:
      - kpsyschool_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M